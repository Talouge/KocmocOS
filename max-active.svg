#!/usr/bin/env python3
"""Re-apply saved display layout (Settings > Display) at login."""
import json, subprocess, sys
sys.path.insert(0, "/usr/lib/kocmoc")
from kocmoc import config
saved = config.load_display()
if not saved:
    sys.exit(0)
try:
    present = {o["name"] for o in json.loads(subprocess.run(["wlr-randr", "--json"], capture_output=True, text=True, timeout=10).stdout)}
except Exception:
    sys.exit(0)
for name, st in saved.items():
    if name in present:
        subprocess.run(config.randr_args(name, st), check=False)
