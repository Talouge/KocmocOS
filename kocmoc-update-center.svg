"""Process helpers: never block the GTK main loop."""
import os
import subprocess
import threading

from gi.repository import GLib


def run(cmd, input=None, timeout=30, env=None):
    """Run synchronously, return (returncode, combined_output)."""
    try:
        p = subprocess.run(cmd, input=input, capture_output=True, text=True,
                           timeout=timeout, env=env)
        return p.returncode, (p.stdout or "") + (p.stderr or "")
    except FileNotFoundError:
        return 127, f"{cmd[0]}: command not found"
    except subprocess.TimeoutExpired:
        return 124, f"{cmd[0]}: timed out"


def out(cmd, timeout=15):
    """stdout only, '' on failure."""
    try:
        p = subprocess.run(cmd, capture_output=True, text=True, timeout=timeout)
        return p.stdout if p.returncode == 0 else ""
    except (FileNotFoundError, subprocess.TimeoutExpired):
        return ""


def in_thread(fn, callback=None):
    """Run fn() in a worker thread, deliver its result to callback on the main loop."""
    def worker():
        try:
            result = fn()
        except Exception as exc:  # surface errors instead of dying silently
            result = exc
        if callback:
            GLib.idle_add(lambda: (callback(result), False)[1])
    threading.Thread(target=worker, daemon=True).start()


def stream(cmd, on_line, on_done, input=None, env=None):
    """Stream stdout+stderr line by line (\\r and \\n both end a line)."""
    def emit(fn, *a):
        GLib.idle_add(lambda: (fn(*a), False)[1])

    def worker():
        rc = 1
        try:
            p = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                 stdin=subprocess.PIPE if input is not None else subprocess.DEVNULL,
                                 env=env)
            if input is not None:
                p.stdin.write(input.encode())
                p.stdin.close()
            buf = b""
            for chunk in iter(lambda: p.stdout.read1(4096), b""):
                buf += chunk
                while True:
                    idx = min([i for i in (buf.find(b"\n"), buf.find(b"\r")) if i >= 0], default=-1)
                    if idx < 0:
                        break
                    line, buf = buf[:idx], buf[idx + 1:]
                    if line.strip():
                        emit(on_line, line.decode(errors="replace"))
            if buf.strip():
                emit(on_line, buf.decode(errors="replace"))
            rc = p.wait()
        except FileNotFoundError:
            emit(on_line, f"{cmd[0]}: command not found")
            rc = 127
        emit(on_done, rc)
    threading.Thread(target=worker, daemon=True).start()


def spawn(cmd):
    """Start a detached process (apps, restarting shell components)."""
    try:
        subprocess.Popen(cmd, start_new_session=True, stdout=subprocess.DEVNULL,
                         stderr=subprocess.DEVNULL, stdin=subprocess.DEVNULL)
        return True
    except FileNotFoundError:
        return False


def restart(name, cmd):
    subprocess.run(["pkill", "-x", name], check=False)
    spawn(cmd)


def is_live():
    try:
        return "archisobasedir" in open("/proc/cmdline").read()
    except OSError:
        return False


def which(name):
    return any(os.access(os.path.join(p, name), os.X_OK)
               for p in os.environ.get("PATH", "/usr/bin").split(":"))
